<svg class="waterfall-svg belief-slide__layers-svg belief-slide__layers-svg--hero" viewBox="0 0 900 620" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="sl75-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="50%" stop-color="#edf2f7"/>
      <stop offset="100%" stop-color="#e4edf5"/>
    </linearGradient>
    <linearGradient id="sl75-ui" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f7fc"/>
    </linearGradient>
    <linearGradient id="sl75-srv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="sl75-db" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4faf6"/>
    </linearGradient>
    <filter id="sl75-sh" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0d2b45" flood-opacity="0.09"/>
    </filter>
    <filter id="sl75-sh-soft" x="-6%" y="-6%" width="112%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.07"/>
    </filter>
    <marker id="sl75-arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8943d"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="url(#sl75-bg)"/>
  <text x="450" y="36" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0d2b45">Three software layers</text>
  <text x="450" y="58" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5a6d7e">End-to-end path - where requests flow and where testing focuses</text>
  <line x1="40" y1="76" x2="860" y2="76" stroke="#b8943d" stroke-width="1.5" opacity="0.5"/>

  <!-- Clients column -->
  <rect x="24" y="96" width="198" height="410" rx="14" fill="rgba(255,255,255,0.65)" stroke="#cbd5e0" stroke-width="1.5" filter="url(#sl75-sh-soft)"/>
  <text x="123" y="124" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0d2b45" letter-spacing="0.08em">CLIENTS</text>
  <text x="123" y="144" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" fill="#718096">User devices</text>
  <rect x="52" y="164" width="96" height="60" rx="7" fill="#fff" stroke="#4a6b82" stroke-width="2" filter="url(#sl75-sh-soft)"/>
  <rect x="62" y="174" width="76" height="38" rx="3" fill="#e8f0f8" stroke="#94a8b8" stroke-width="1"/>
  <line x1="70" y1="184" x2="130" y2="184" stroke="#cbd5e0" stroke-width="1"/>
  <line x1="70" y1="194" x2="118" y2="194" stroke="#cbd5e0" stroke-width="1"/>
  <rect x="82" y="228" width="82" height="9" rx="2" fill="#cbd5e0"/>
  <text x="123" y="222" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" fill="#4a5568">Desktop</text>
  <rect x="72" y="268" width="56" height="104" rx="11" fill="#fff" stroke="#4a6b82" stroke-width="2" filter="url(#sl75-sh-soft)"/>
  <rect x="82" y="284" width="36" height="72" rx="4" fill="#e8f0f8"/>
  <circle cx="100" cy="278" r="2.5" fill="#cbd5e0"/>
  <text x="123" y="392" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" fill="#4a5568">Mobile</text>
  <text x="123" y="430" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#5a6d7e">Browser / app / API</text>

  <!-- Network label (clear of arrow) -->
  <text x="228" y="292" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#718096">LAN / WAN / internet</text>
  <path d="M 222 308 L 252 308" stroke="#4a6b82" stroke-width="2.5" marker-end="url(#sl75-arr)"/>

  <!-- Layer 1 UI -->
  <g filter="url(#sl75-sh)">
    <rect x="268" y="96" width="608" height="132" rx="16" fill="url(#sl75-ui)" stroke="#0d2b45" stroke-width="2.5"/>
    <rect x="268" y="96" width="8" height="132" rx="3" fill="#b8943d"/>
    <circle cx="304" cy="162" r="18" fill="rgba(184,148,61,0.22)" stroke="#b8943d" stroke-width="2"/>
    <text x="304" y="168" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0d2b45">1</text>
    <text x="338" y="128" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0d2b45">User interface (UI)</text>
    <text x="338" y="152" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#4a5568">Presentation layer - what users see and use</text>
    <text x="338" y="174" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#4a5568">Browsers, apps, forms, navigation</text>
    <text x="338" y="198" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#1565b5" font-weight="600">QA focus: functional, usability, validation, accessibility</text>
    <rect x="720" y="112" width="144" height="100" rx="10" fill="rgba(13,43,69,0.05)" stroke="#cbd5e0" stroke-width="1"/>
    <text x="792" y="138" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0d2b45">HTTP / HTTPS</text>
    <text x="792" y="158" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" fill="#718096">REST, SOAP,</text>
    <text x="792" y="174" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" fill="#718096">GraphQL</text>
  </g>

  <!-- Gap 1: label left of arrow (no overlap with stroke) -->
  <text x="558" y="258" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#5a6d7e">Application requests</text>
  <line x1="572" y1="246" x2="572" y2="270" stroke="#b8943d" stroke-width="3" marker-end="url(#sl75-arr)"/>

  <!-- Layer 2 Servers -->
  <g filter="url(#sl75-sh)">
    <rect x="268" y="268" width="608" height="148" rx="16" fill="url(#sl75-srv)" stroke="#1565b5" stroke-width="2.8"/>
    <rect x="268" y="268" width="8" height="148" rx="3" fill="#1565b5" opacity="0.88"/>
    <circle cx="304" cy="342" r="18" fill="rgba(21,101,181,0.14)" stroke="#1565b5" stroke-width="2"/>
    <text x="304" y="348" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0d2b45">2</text>
    <text x="338" y="302" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0d2b45">Servers</text>
    <text x="338" y="328" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#4a5568">Application and web tiers</text>
    <text x="338" y="350" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#4a5568">Sessions, APIs, business logic, integrations</text>
    <text x="338" y="378" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#1565b5" font-weight="600">QA focus: performance, load, security, contracts</text>
    <rect x="720" y="288" width="144" height="108" rx="10" fill="rgba(21,101,181,0.07)" stroke="#cbd5e0" stroke-width="1"/>
    <text x="792" y="316" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0d2b45">Middleware</text>
    <text x="792" y="338" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" fill="#718096">Auth, cache,</text>
    <text x="792" y="354" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="8.5" fill="#718096">queues</text>
  </g>

  <!-- Gap 2: label left of arrow -->
  <text x="558" y="446" text-anchor="end" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#5a6d7e">SQL / ORM</text>
  <line x1="572" y1="434" x2="572" y2="458" stroke="#b8943d" stroke-width="3" marker-end="url(#sl75-arr)"/>

  <!-- Layer 3 Database -->
  <g filter="url(#sl75-sh)">
    <rect x="268" y="456" width="608" height="132" rx="16" fill="url(#sl75-db)" stroke="#2f6f4f" stroke-width="2.5"/>
    <rect x="268" y="456" width="8" height="132" rx="3" fill="#2f6f4f" opacity="0.78"/>
    <circle cx="304" cy="522" r="18" fill="rgba(47,111,79,0.16)" stroke="#2f6f4f" stroke-width="2"/>
    <text x="304" y="528" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0d2b45">3</text>
    <text x="338" y="488" font-family="Segoe UI, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0d2b45">Database</text>
    <text x="338" y="514" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#4a5568">Tables, rows, columns, constraints</text>
    <text x="338" y="536" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#4a5568">Relational data (via DBMS)</text>
    <text x="338" y="560" font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#2f6f4f" font-weight="600">QA focus: integrity, SQL checks, reports</text>
    <rect x="720" y="478" width="144" height="88" rx="10" fill="rgba(47,111,79,0.07)" stroke="#2f6f4f" stroke-width="1.2"/>
    <text x="792" y="506" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0d2b45">DBMS</text>
    <text x="792" y="528" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#718096">e.g. Oracle,</text>
    <text x="792" y="544" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="8" fill="#718096">SQL Server, PostgreSQL</text>
  </g>

  <rect x="32" y="598" width="836" height="18" rx="5" fill="rgba(13,43,69,0.04)" stroke="#e2e8f0" stroke-width="1"/>
  <text x="450" y="610" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="9" fill="#5a6d7e">Each layer can hide defects - tests match behaviour and data to requirements across the stack.</text>
</svg>
